apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elastic-agent-leases
  namespace: elastic-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elastic-agent-leases
  namespace: elastic-system
subjects:
  - kind: ServiceAccount
    name: elastic-agent
    namespace: elastic-system
roleRef:
  kind: Role
  name: elastic-agent-leases
  apiGroup: rbac.authorization.k8s.io
