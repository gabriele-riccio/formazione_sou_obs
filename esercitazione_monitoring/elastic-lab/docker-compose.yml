services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    networks: [elastic-lab-net]
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.http.ssl.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "curl -s --fail -u elastic:${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
  kibana_setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: kibana_setup
    networks: [elastic-lab-net]
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c 'until curl -s -u elastic:${ELASTIC_PASSWORD} -X POST http://elasticsearch:9200/_security/user/kibana_system/_password -H "Content-Type: application/json" -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "{}"; do echo "Attendo Elasticsearch..."; sleep 5; done; echo "Password impostata."'
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    networks: [elastic-lab-net]
    ports:
      - "5601:5601"
    depends_on:
      kibana_setup:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS=["https://fleet-server:8220"]
      - XPACK_FLEET_OUTPUTS=[{"id":"fleet-default-output","name":"default","is_default":true,"is_default_monitoring":true,"type":"elasticsearch","hosts":["http://elasticsearch:9200"]}]
      - XPACK_FLEET_PACKAGES=[{"name":"fleet_server","version":"latest"},{"name":"system","version":"latest"}]
      - XPACK_FLEET_AGENT_POLICIES=[{"name":"Fleet Server Policy","id":"fleet-server-policy","is_default_fleet_server":true,"package_policies":[{"name":"fleet_server-1","package":{"name":"fleet_server"}}]}]
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:8.15.0
    container_name: fleet-server
    networks: [elastic-lab-net]
    ports:
      - "8220:8220"
    depends_on:
      kibana:
        condition: service_started
    volumes:
      - ./certs:/certs:ro
    environment:
      - FLEET_SERVER_ENABLE=true
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://elasticsearch:9200
      - FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVER_SERVICE_TOKEN}
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_CERT=/certs/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet-server.key
      - FLEET_URL=https://fleet-server:8220
      - FLEET_CA=/certs/fleet-server.crt

networks:
  elastic-lab-net:
    external: true