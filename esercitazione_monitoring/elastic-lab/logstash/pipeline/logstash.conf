input {
  elastic_agent {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/certs/logstash/logstash.key"
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca-logstash/ca.crt"]
    ssl_client_authentication => "required"
  }
}

output {
  # Cluster 1
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    data_stream => "true"
  }

  # Cluster 2
  elasticsearch {
    hosts => ["http://elasticsearch2:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    data_stream => "true"
  }
}