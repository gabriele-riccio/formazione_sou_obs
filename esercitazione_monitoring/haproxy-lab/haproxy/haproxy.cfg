global
    log stdout local0
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend web_in
    bind *:8080
    default_backend web_pool

backend web_pool
    balance roundrobin
    option httpchk GET /
    server web1 web1:80 check
    server web2 web2:80 check

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request use-service prometheus-exporter if { path /metrics }
